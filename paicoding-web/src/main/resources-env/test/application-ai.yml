net:
  proxy:
    # 代理相关信息
    - ip: 127.0.0.1
      port: 1080
      type: SOCKS

# ============ Spring AI 模型配置 ============

# DeepSeek（走 OpenAI 兼容协议）
deepseek:
  apiHost: https://api.deepseek.com
  apiKey: # 使用自己的密钥进行替换

# ChatGPT（OpenAI 原生）
chatgpt:
  conf:
    CHAT_GPT_3_5:
      keys:
        - # 这里输入你的key
      apiHost: https://api.openai.com/

# 智谱 GLM
zhipu:
  apiSecretKey: # 使用自己的密钥进行替换

# 讯飞星火（WebSocket 协议，通过 XunFeiChatModelAdapter 桥接到 Spring AI）
xunfei:
  hostUrl: http://spark-api.xf-yun.com/v1.1/chat
  appId:
  apiKey:
  apiSecret:
