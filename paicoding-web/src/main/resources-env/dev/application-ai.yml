net:
  proxy:
    # 代理相关信息
    - ip: 127.0.0.1
      port: 1080
      type: SOCKS

ai:
  maxNum:
    basic: 5 # 默认兜底策略
    wechat: 10 # 公众号用户
    star: 100 # 星球用户
    starTry: 30 # 星球用户
    invited: 0.1 # 被邀请
    inviteNum: 0.2 # 邀请人数执行策略
    starNumber: 4000 # 目前为 4000
  source: # 支持的AI模型（按优先级排序）
    - DEEP_SEEK
    - CHAT_GPT_3_5
    - ZHI_PU_AI
    - XUN_FEI_AI

# ============ Spring AI 模型配置 ============

# DeepSeek（走 OpenAI 兼容协议）
deepseek:
  apiHost: https://api.deepseek.com
  apiKey: # 使用自己的密钥进行替换

# ChatGPT（OpenAI 原生）
chatgpt:
  conf:
    CHAT_GPT_3_5:
      keys:
        - # 这里输入你的key
      apiHost: https://api.openai.com/

# 智谱 GLM
zhipu:
  apiSecretKey: # 使用自己的密钥进行替换

# 讯飞星火（WebSocket 协议，通过 XunFeiChatModelAdapter 桥接到 Spring AI）
xunfei:
  hostUrl: http://spark-api.xf-yun.com/v2.1/chat
  domain: "generalv2"
  appId:
  apiKey:
  apiSecret:

logging:
  level:
    com.github.paicoding.forum.service.chatai: DEBUG # 本地启动时，开启AI模块debug日志
